# Local full stack for the merged product Backend (explicit dev settings; not a production config).
#   cp back/services/backend/.env.example .env   # fill LLM_SERVICE_TOKEN, HF_* only if you have endpoints
#   docker compose up --build
# Production uses PostgreSQL + a private bucket on Railway; see back/services/backend/DEPLOYMENT.md.
x-backend: &backend
  build: { context: ., dockerfile: back/services/backend/Dockerfile.worker }
  restart: unless-stopped
  environment: &backend-env
    DATABASE_URL: postgresql://claimly:claimly@postgres:5432/claimly?sslmode=disable
    LOCAL_DEV: "true"
    STORAGE_BACKEND: local
    LOCAL_STORAGE_DIR: /data/originals
    LLM_BASE_URL: http://llm:8001
    LLM_SERVICE_TOKEN: ${LLM_SERVICE_TOKEN:?Set LLM_SERVICE_TOKEN in .env}
    SCHEDULER_SECRET: ${SCHEDULER_SECRET:-}
    FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
    SOURCE_REVIEW_MODE: ${SOURCE_REVIEW_MODE:-operator}
    HF_TOKEN: ${HF_TOKEN:-}
    HF_EMBEDDING_URL: ${HF_EMBEDDING_URL:-}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hf_endpoint}
  volumes: [claimly-originals:/data/originals]
  depends_on:
    postgres: { condition: service_healthy }
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: claimly, POSTGRES_PASSWORD: claimly, POSTGRES_DB: claimly }
    volumes: [claimly-pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD", "pg_isready", "-U", "claimly"], interval: 5s, retries: 20 }
  migrate:
    <<: *backend
    restart: "no"
    command: ["python", "-m", "app.migrate"]
  api:
    <<: *backend
    build: { context: ., dockerfile: back/services/backend/Dockerfile.api }
    ports: ["127.0.0.1:8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    <<: *backend
    depends_on: { migrate: { condition: service_completed_successfully } }
  llm:
    build: { context: ., dockerfile: services/llm/Dockerfile }
    restart: unless-stopped
    environment:
      LLM_SERVICE_TOKEN: ${LLM_SERVICE_TOKEN:?Set LLM_SERVICE_TOKEN in .env}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_EMBEDDING_URL: ${HF_EMBEDDING_URL:-}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-}
      MODEL_NAME: Qwen/Qwen3.8-27B
volumes:
  claimly-pg:
  claimly-originals:
